name: Scraping Diario de Noticias Tech

on:
  schedule:
    # 7 PM Argentina (UTC-3) = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth-oauthlib google-auth-httplib2 google-auth-httplib2 google-auth
      
      - name: Run news scraper
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python news-scraper.py
      
      - name: Send notification (opcional)
        if: always()
        run: |
          echo "Scraping completado a las $(date)"
